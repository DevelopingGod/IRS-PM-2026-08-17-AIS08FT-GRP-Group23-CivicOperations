[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civicops-crew-dispatch"
version = "1.0.0"
description = "CivicOps AI - dynamic crew dispatch (genetic algorithm) and road-network routing (A*) research component"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12", "pandas>=2.2", "pyarrow>=15", "matplotlib>=3.8", "pyyaml>=6", "tzdata>=2024.1"]

[project.optional-dependencies]
network-build = ["networkx>=3.2", "shapely>=2.0"]
test = ["pytest>=8"]

[project.scripts]
crew-dispatch = "crew_dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
